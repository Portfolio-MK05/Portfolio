<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NordicGear – sprzęt komputerowy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
 <div class="wrap bar">
  <button class="icon burger" id="burger" aria-label="Menu" aria-expanded="false">☰</button>
  <a class="logo" href="#" aria-label="NordicGear – strona główna">Nordic<b>Gear</b></a>
  <nav id="nav" aria-label="Kategorie"></nav>
  <div class="search"><input id="q" type="search" placeholder="Szukaj produktów…" aria-label="Szukaj produktów"></div>
  <button class="icon" id="theme" aria-label="Zmień motyw">◐</button>
  <button class="icon" id="cartBtn" aria-label="Koszyk">🛒<span class="badge" id="badge">0</span></button>
 </div>
</header>

<div class="hero"><div class="wrap">
 <small>Nowa seria</small>
 <h1>RTX 50XX<br>Gaming</h1>
 <p>Karty graficzne, laptopy i zestawy gotowe do grania w 4K. Wysyłka w 24 godziny.</p>
 <a class="btn" href="#sklep" id="cta">Zobacz produkty</a>
</div></div>

<section id="sklep"><div class="wrap">
 <h2 id="title">Popularne produkty</h2>
 <div class="tools">
  <label>Sortuj <select id="sort"><option value="pop">Popularność</option><option value="asc">Cena rosnąco</option><option value="desc">Cena malejąco</option></select></label>
  <label>Cena do <input id="max" type="range" min="100" max="9000" step="100" value="9000"> <output id="maxOut">9000 zł</output></label>
  <span class="count" id="count" aria-live="polite"></span>
 </div>
 <div class="grid" id="grid"></div>
</div></section>

<section class="contact" id="kontakt"><div class="wrap">
 <h2>Kontakt</h2>
 <form id="form" novalidate>
  <div class="f"><label for="n">Imię</label><input id="n" autocomplete="name"><p class="err"></p></div>
  <div class="f"><label for="e">E-mail</label><input id="e" type="email" autocomplete="email"><p class="err"></p></div>
  <div class="f"><label for="m">Wiadomość</label><textarea id="m"></textarea><p class="err"></p></div>
  <button class="btn" type="submit">Wyślij wiadomość</button>
 </form>
 <p class="ok" id="ok" hidden>Dziękujemy! Odpowiemy w ciągu jednego dnia roboczego.</p>
</div></section>
<footer>NordicGear Mikołaj K.</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Koszyk" aria-hidden="true">
 <header><h2>Koszyk</h2><button class="icon" id="closeCart" aria-label="Zamknij koszyk">✕</button></header>
 <div class="lines" id="lines"></div>
 <div class="total"><span>Razem</span><span id="sum">0 zł</span></div>
 <button class="btn" id="checkout">Przejdź do kasy</button>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Karta produktu"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
